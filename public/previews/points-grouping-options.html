<header><h1>积分项分组方案</h1><p>独立候选预览 · 仅比较分组层级，业务页面保持原样</p><nav aria-label="比较方案"><button aria-pressed="true" data-view="all">并排比较</button><button aria-pressed="false" data-view="a">A · 浅灰整组</button><button aria-pressed="false" data-view="b">B · 灰底标题</button><button aria-pressed="false" data-view="c">C · 灰底白组</button></nav><p class="notice">可试填原因、调整分值、移除和添加项目。这里只演示卡片组合，不会修改学员数据。</p></header><main id="board"></main>
<script>
const options=[['a','A · 浅灰整组','最接近参考图二：整组浅灰底，组间用白色留白区分。'],['b','B · 灰底标题','只强调项目标题，输入区域保留白底，分组更轻。'],['c','C · 灰底白组','灰色区域承托独立白组，分组边界最明确。']];
const icon=n=>`<svg class="icon" aria-hidden="true" viewBox="0 0 1024 1024"><use href="#SSX-${n}"></use></svg>`;
const data=[{name:'其他奖励',points:''},{name:'课后练习优秀',points:'5'}];
function entry(item){const el=document.createElement('section');el.className='entry';el.innerHTML=`<div class="entry-head"><h3>${item.name}</h3><button class="remove" aria-label="移除${item.name}">移除</button></div><div class="row divider"><label>加分分值</label><div class="stepper-wrap"><div class="stepper"><button aria-label="减少${item.name}分值" data-step="-1">${icon('minus')}</button><input class="number" inputmode="decimal" placeholder="0" value="${item.points}" aria-label="${item.name}分值"><button aria-label="增加${item.name}分值" data-step="1">${icon('plus')}</button></div><span>分</span></div></div><div class="row"><label>原因<span class="optional">（选填）</span></label><input class="reason" placeholder="请输入" aria-label="${item.name}原因"></div>`;return el;}
function update(sample){const count=sample.querySelectorAll('.entry').length;sample.querySelector('.count').textContent=count;const values=[...sample.querySelectorAll('.number')].map(x=>Number(x.value)||0);sample.querySelector('.sum').textContent='+'+Number(values.reduce((a,b)=>a+b,0).toFixed(2))+' 分';}
options.forEach(([key,title,desc])=>{const el=document.createElement('article');el.className='concept '+key;el.dataset.option=key;el.innerHTML=`<div class="caption"><h2>${title}</h2><p>${desc}</p></div><div class="sample"><div class="summary"><strong>积分项</strong><span class="count">2</span><span class="balance">金灿灿：128 积分</span></div><div class="entries"></div><button class="add">${icon('plus-circle')}添加积分项</button><div class="footer"><div class="total"><span>本次加分</span><strong class="sum">+5 分</strong></div><button class="confirm">确认加分</button></div></div><p class="hint">外层行高56px · 步进器28px · 圆圈加号20px</p>`;const sample=el.querySelector('.sample');data.forEach(x=>sample.querySelector('.entries').append(entry(x)));sample.addEventListener('input',()=>update(sample));sample.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.classList.contains('remove'))btn.closest('.entry').remove();if(btn.dataset.step){const input=btn.closest('.stepper').querySelector('input');input.value=String(Math.max(0,Math.round(((Number(input.value)||0)+Number(btn.dataset.step))*100)/100));}if(btn.classList.contains('add'))sample.querySelector('.entries').append(entry({name:'按时完成作业',points:'2'}));if(btn.classList.contains('confirm')){btn.textContent='仅预览';setTimeout(()=>btn.textContent='确认加分',1200);}update(sample);});document.querySelector('#board').append(el);});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;document.body.classList.toggle('single',b.dataset.view!=='all');document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('.concept').forEach(x=>x.classList.toggle('selected',x.dataset.option===b.dataset.view));});
</script></html>
