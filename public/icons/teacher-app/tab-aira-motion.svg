<svg preserveAspectRatio="none" overflow="visible" style="display: block;" width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">

<style>
@media (prefers-reduced-motion: no-preference) {
  g[id="Ellipse 2"] { transform-origin: 22px 22px; animation: aira-color-first 8s ease-in-out infinite alternate; }
  g[id="Ellipse 3"] { transform-origin: 22px 22px; animation: aira-color-second 7s ease-in-out -3s infinite alternate; }
  #aira-highlight { transform-origin: 22px 22px; animation: aira-highlight-flow 5s ease-in-out infinite; }
  g[id="Star 4"] { transform-origin: 22px 22px; animation: aira-icon-turn 6s ease-in-out infinite; }
}
@keyframes aira-color-first {
  from { transform: translate(0, 0) scale(1); opacity: 1; }
  to { transform: translate(-10px, -9px) scale(1.12); opacity: .86; }
}
@keyframes aira-color-second {
  from { transform: translate(0, 0) scale(.94); opacity: .8; }
  to { transform: translate(14px, -7px) scale(1.08); opacity: 1; }
}
@keyframes aira-highlight-flow {
  0%, 100% { transform: translate(-3px, 2px) rotate(-12deg); opacity: .35; }
  50% { transform: translate(7px, 5px) rotate(18deg); opacity: .75; }
}
/* Same vertical-axis flip stages as the login AI glyph, with a longer rest. */
@keyframes aira-icon-turn {
  0%, 60% { transform: perspective(96px) rotateY(0deg); }
  65% { transform: perspective(96px) rotateY(86deg); }
  70% { transform: perspective(96px) rotateY(180deg); }
  75% { transform: perspective(96px) rotateY(274deg); }
  80%, 100% { transform: perspective(96px) rotateY(360deg); }
}
</style>
